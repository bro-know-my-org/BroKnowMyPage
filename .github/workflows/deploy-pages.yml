name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high --registry=https://registry.npmjs.org

      - name: Validate content and types
        run: pnpm check:content && pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bro-know-my.org' }}
          VITE_ARTALK_SERVER: ${{ vars.VITE_ARTALK_SERVER || 'https://comment.bro-know-my.org' }}
          VITE_ARTALK_SITE: ${{ vars.VITE_ARTALK_SITE || '兄弟懂我的页面' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
