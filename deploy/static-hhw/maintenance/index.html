<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#4b0082" />
    <title>施工中 | BKMPG</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #201f1c;
        background: #f5efe4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 20%, rgb(255 255 255 / 75%), transparent 32%),
          radial-gradient(circle at 82% 78%, rgb(225 197 145 / 28%), transparent 30%),
          #f5efe4;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgb(63 54 38 / 14%);
        border-radius: 28px;
        background: rgb(255 253 248 / 82%);
        box-shadow: 0 24px 70px rgb(71 56 29 / 12%);
        backdrop-filter: blur(12px);
      }

      .label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 24px;
        padding: 8px 13px;
        border-radius: 999px;
        color: #4b0082;
        background: #eadcf4;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }

      .label::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4b0082;
        content: "";
        box-shadow: 0 0 0 5px rgb(210 139 32 / 14%);
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 9vw, 72px);
        line-height: 1.02;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 30em;
        margin: 24px 0 0;
        color: #625e55;
        font-size: clamp(16px, 3vw, 19px);
        line-height: 1.8;
      }

      footer {
        margin-top: 48px;
        color: #8d877c;
        font-size: 14px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          color: #f2eee5;
          background: #171611;
        }

        body {
          background:
            radial-gradient(circle at 18% 20%, rgb(107 88 53 / 24%), transparent 32%),
            radial-gradient(circle at 82% 78%, rgb(151 101 29 / 16%), transparent 30%),
            #171611;
        }

        main {
          border-color: rgb(240 220 181 / 13%);
          background: rgb(34 32 26 / 86%);
          box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
        }

        .label {
          color: #d8b4fe;
          background: #32124a;
        }

        p {
          color: #bdb6a9;
        }

        footer {
          color: #8f897e;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="label">UNDER CONSTRUCTION</div>
      <h1>施工中</h1>
      <p>coming s♾n</p>
      <footer>BKMPG</footer>
    </main>
  </body>
</html>
