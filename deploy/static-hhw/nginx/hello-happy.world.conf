server {
    listen 80;
    listen [::]:80;
    server_name hello-happy.world www.hello-happy.world;

    return 301 https://hello-happy.world$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hello-happy.world;

    ssl_certificate /etc/letsencrypt/live/hello-happy.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hello-happy.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hello-happy.world$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hello-happy.world;

    root /opt/bro-know-my-page/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/hello-happy.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hello-happy.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml application/xml+rss image/svg+xml;

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location /api/ {
        return 410;
    }
}
