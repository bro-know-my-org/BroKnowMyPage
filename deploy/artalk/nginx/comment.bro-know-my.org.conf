server {
    listen 80;
    listen [::]:80;
    server_name comment.bro-know-my.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name comment.bro-know-my.org;

    ssl_certificate /etc/letsencrypt/live/comment.bro-know-my.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comment.bro-know-my.org/privkey.pem;

    client_max_body_size 10m;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:23366;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Cache-Control "no-store" always;
    }
}
